<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Feed Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pop-header">
      <h1>YouTube Feed Blocker</h1>
    </header>

    <main>
      <section class="pop-section" aria-labelledby="hideTitle">
        <h2 id="hideTitle" class="pop-title">What should we hide?</h2>
        <div class="pop-card">
          <label class="pop-toggle">
            <span class="pop-toggle__text"><strong>Home feed</strong><small>The endless grid on the front page</small></span>
            <input type="checkbox" class="pop-switch" role="switch" data-setting="hideHomeFeed" />
          </label>
          <label class="pop-toggle">
            <span class="pop-toggle__text"><strong>Shorts</strong><small>Vertical videos, wherever they appear</small></span>
            <input type="checkbox" class="pop-switch" role="switch" data-setting="shortsBlocking" />
          </label>
          <label class="pop-toggle">
            <span class="pop-toggle__text"><strong>Up next</strong><small>Suggestions beside and after a video</small></span>
            <input type="checkbox" class="pop-switch" role="switch" data-setting="hideUpNext" />
          </label>
          <label class="pop-toggle">
            <span class="pop-toggle__text"><strong>Autoplay</strong><small>The next video starting on its own</small></span>
            <input type="checkbox" class="pop-switch" role="switch" data-setting="blockAutoplay" />
          </label>
          <label class="pop-toggle">
            <span class="pop-toggle__text"><strong>Comments</strong><small>Below every video</small></span>
            <input type="checkbox" class="pop-switch" role="switch" data-setting="hideComments" />
          </label>
        </div>
      </section>

      <div id="feedSections">
        <section class="pop-section" aria-labelledby="peekTitle">
          <h2 id="peekTitle" class="pop-title">How hard should it be to peek?</h2>
          <div class="pop-options" role="radiogroup" aria-labelledby="peekTitle">
            <label class="pop-option">
              <input type="radio" class="pop-radio" name="peekLevel" value="pause" />
              <span><strong>Pause</strong><small>Wait 10 seconds before the feed opens</small></span>
            </label>
            <label class="pop-option">
              <input type="radio" class="pop-radio" name="peekLevel" value="reason" />
              <span><strong>Pause and say why</strong><small>Type what you came for, then wait</small></span>
            </label>
            <label class="pop-option">
              <input type="radio" class="pop-radio" name="peekLevel" value="none" />
              <span><strong>No peeking</strong><small>The feed stays hidden. Search and subscriptions still work</small></span>
            </label>
          </div>
        </section>

        <section class="pop-section" aria-labelledby="insteadTitle">
          <h2 id="insteadTitle" class="pop-title">Instead of the feed</h2>
          <div class="pop-options" role="radiogroup" aria-labelledby="insteadTitle">
            <label class="pop-option">
              <input type="radio" class="pop-radio" name="feedMode" value="blank" />
              <span><strong>Blank</strong><small>A calm, empty home page</small></span>
            </label>
            <label class="pop-option">
              <input type="radio" class="pop-radio" name="feedMode" value="widgets" />
              <span><strong>Focus widgets</strong><small>A to-do list and a daily quote</small></span>
            </label>
            <label class="pop-option">
              <input type="radio" class="pop-radio" name="feedMode" value="ai" />
              <span><strong>AI-curated</strong><small>Describe the feed you want. Preview only, nothing is filtered yet</small></span>
            </label>
          </div>

          <div class="pop-sub" id="widgetOptions" hidden>
            <label class="pop-check"><input type="checkbox" id="w_todo" /> To-do list</label>
            <label class="pop-check"><input type="checkbox" id="w_quote" /> Daily quote</label>
          </div>

          <div class="pop-sub" id="aiOptions" hidden>
            <label class="pop-field-label" for="aiInstruction">Feed instruction</label>
            <textarea
              id="aiInstruction"
              rows="3"
              maxlength="500"
              placeholder='e.g. "Only in-depth coding tutorials and conference talks. No clickbait, no reactions, no news."'
            ></textarea>
            <p class="pop-hint">Saved now. Filtering arrives in a later version.</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="pop-footer"><span id="version"></span></footer>

    <script src="../lib/defaults.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
